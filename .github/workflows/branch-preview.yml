name: Branch preview

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing pull request number to deploy
        required: true
        type: number
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: branch-preview-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 77d31ec7cf644c489ff4a05f71d9eefb
  WORKER_NAME: branch-preview-example
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
  DATABASE_NAMESPACE: pr_${{ github.event.pull_request.number || inputs.pr_number }}
  PREVIEW_ALIAS: pr-${{ github.event.pull_request.number || inputs.pr_number }}
  HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_PLANETSCALE_HYPERDRIVE_ID }}

jobs:
  preview:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pr_number) }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify preview configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_CLEANUP_TOKEN: ${{ secrets.PREVIEW_CLEANUP_TOKEN }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN PREVIEW_CLEANUP_TOKEN HYPERDRIVE_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done

      - name: Install and validate
        run: |
          echo "PREVIEW_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          npm ci
          npm run check

      - name: Upload full-stack Worker preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_CLEANUP_TOKEN: ${{ secrets.PREVIEW_CLEANUP_TOKEN }}
        run: |
          set -euo pipefail
          preview_config="dist/branch_preview_example/wrangler.preview.json"
          secrets_file="$RUNNER_TEMP/preview-secrets.json"
          jq \
            --arg id "$HYPERDRIVE_ID" \
            --arg deployment "pull-request-$PR_NUMBER" \
            --arg namespace "$DATABASE_NAMESPACE" \
            --arg sha "$PREVIEW_COMMIT_SHA" \
            '.hyperdrive = [{binding: "HYPERDRIVE", id: $id}] |
             .vars = {DEPLOYMENT_ENV: $deployment, DATABASE_NAMESPACE: $namespace, COMMIT_SHA: $sha} |
             .secrets = {required: ["PREVIEW_CLEANUP_TOKEN"]} |
             .placement = {mode: "smart"}' \
            dist/branch_preview_example/wrangler.json > "$preview_config"
          jq -n --arg token "$PREVIEW_CLEANUP_TOKEN" '{PREVIEW_CLEANUP_TOKEN: $token}' > "$secrets_file"

          npx wrangler versions upload --config "$preview_config" \
            --secrets-file "$secrets_file" \
            --preview-alias "$PREVIEW_ALIAS" \
            --message "PR #$PR_NUMBER at $PREVIEW_COMMIT_SHA"

          subdomain_response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")
          subdomain=$(jq -r '.result.subdomain' <<<"$subdomain_response")
          preview_url="https://$PREVIEW_ALIAS-$WORKER_NAME.$subdomain.workers.dev"
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Verify frontend, API, Hyperdrive, and PlanetScale
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          marker="smoke-${PREVIEW_COMMIT_SHA:0:12}"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "$PREVIEW_URL/" >/dev/null && \
              curl --fail --silent --show-error "$PREVIEW_URL/api/health" | jq -e --arg namespace "$DATABASE_NAMESPACE" '.ok == true and .databaseNamespace == $namespace' >/dev/null && \
              curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' \
                --data "$(jq -cn --arg body "$marker" '{body: $body}')" "$PREVIEW_URL/api/notes" | jq -e --arg marker "$marker" '.note.body == $marker' >/dev/null && \
              curl --fail --silent --show-error "$PREVIEW_URL/api/notes" | jq -e --arg marker "$marker" '.notes | any(.body == $marker)' >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Preview did not become healthy"
          exit 1

      - name: Publish GitHub deployment
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.PREVIEW_COMMIT_SHA,
              environment: `pr-${process.env.PR_NUMBER}`,
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: "success",
              environment_url: process.env.PREVIEW_URL,
            });

      - name: Add preview link to pull request
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = "<!-- full-stack-branch-preview -->";
            const body = `${marker}\n## Full-stack branch preview\n\n✅ **[Open preview](${process.env.PREVIEW_URL})**\n\n- Worker alias: \`${process.env.PREVIEW_ALIAS}\`\n- PlanetScale namespace: \`${process.env.DATABASE_NAMESPACE}\`\n- Authentication: Cloudflare only\n- Database path: React → Hono → Cloudflare Hyperdrive → Cloudflare-managed PlanetScale\n- Commit: \`${process.env.PREVIEW_COMMIT_SHA.slice(0, 7)}\``;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number, body });
            }

  cleanup:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete isolated preview data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_CLEANUP_TOKEN: ${{ secrets.PREVIEW_CLEANUP_TOKEN }}
        run: |
          set -euo pipefail
          subdomain_response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")
          subdomain=$(jq -r '.result.subdomain' <<<"$subdomain_response")
          preview_url="https://$PREVIEW_ALIAS-$WORKER_NAME.$subdomain.workers.dev"
          curl --fail-with-body --silent --show-error -X DELETE \
            -H "Authorization: Bearer $PREVIEW_CLEANUP_TOKEN" \
            "$preview_url/api/preview-data" | jq -e --arg namespace "$DATABASE_NAMESPACE" '.ok == true and .databaseNamespace == $namespace' >/dev/null
