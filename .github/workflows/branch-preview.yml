name: Branch preview

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing pull request number to deploy
        required: true
        type: number
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: branch-preview-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 77d31ec7cf644c489ff4a05f71d9eefb
  WORKER_NAME: branch-preview-example
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
  PSCALE_BRANCH: pr-${{ github.event.pull_request.number || inputs.pr_number }}
  PREVIEW_ALIAS: pr-${{ github.event.pull_request.number || inputs.pr_number }}
  HYPERDRIVE_NAME: branch-preview-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  PASSWORD_NAME: github-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  PLANETSCALE_ORG_NAME: ${{ vars.PLANETSCALE_ORG_NAME }}
  PLANETSCALE_DATABASE_NAME: ${{ vars.PLANETSCALE_DATABASE_NAME }}

jobs:
  preview:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pr_number) }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: planetscale/setup-pscale-action@v1

      - name: Verify preview configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN PLANETSCALE_SERVICE_TOKEN_ID PLANETSCALE_SERVICE_TOKEN PLANETSCALE_ORG_NAME PLANETSCALE_DATABASE_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done

      - name: Install and validate
        run: |
          npm ci
          npm run check

      - name: Create isolated PlanetScale branch
        env:
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          if pscale branch show "$PLANETSCALE_DATABASE_NAME" "$PSCALE_BRANCH" --org "$PLANETSCALE_ORG_NAME" >/dev/null 2>&1; then
            echo "PlanetScale branch $PSCALE_BRANCH already exists"
          else
            pscale branch create "$PLANETSCALE_DATABASE_NAME" "$PSCALE_BRANCH" \
              --from main --wait --org "$PLANETSCALE_ORG_NAME"
          fi

      - name: Create branch credentials
        id: database
        env:
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          pscale password delete "$PLANETSCALE_DATABASE_NAME" "$PSCALE_BRANCH" \
            --name "$PASSWORD_NAME" --force --org "$PLANETSCALE_ORG_NAME" >/dev/null 2>&1 || true

          response=$(pscale password create "$PLANETSCALE_DATABASE_NAME" "$PSCALE_BRANCH" "$PASSWORD_NAME" \
            --role admin --format json --org "$PLANETSCALE_ORG_NAME")
          host=$(jq -r '.access_host_url' <<<"$response")
          username=$(jq -r '.username' <<<"$response")
          password=$(jq -r '.plain_text' <<<"$response")
          if [ -z "$host" ] || [ -z "$username" ] || [ -z "$password" ] || [ "$password" = "null" ]; then
            echo "::error::PlanetScale did not return usable credentials"
            exit 1
          fi
          echo "::add-mask::$username"
          echo "::add-mask::$password"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "username=$username" >> "$GITHUB_OUTPUT"
          echo "password=$password" >> "$GITHUB_OUTPUT"

      - name: Create isolated Hyperdrive configuration
        id: hyperdrive
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_HOST: ${{ steps.database.outputs.host }}
          DATABASE_USER: ${{ steps.database.outputs.username }}
          DATABASE_PASSWORD: ${{ steps.database.outputs.password }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs"
          list=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api")
          existing_id=$(jq -r --arg name "$HYPERDRIVE_NAME" '.result[]? | select(.name == $name) | .id' <<<"$list" | head -n 1)
          if [ -n "$existing_id" ]; then
            curl --fail-with-body --silent --show-error -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$existing_id" >/dev/null
          fi

          payload=$(jq -n \
            --arg name "$HYPERDRIVE_NAME" \
            --arg host "$DATABASE_HOST" \
            --arg database "$PLANETSCALE_DATABASE_NAME" \
            --arg user "$DATABASE_USER" \
            --arg password "$DATABASE_PASSWORD" \
            '{name: $name, origin: {scheme: "mysql", host: $host, port: 3306, database: $database, user: $user, password: $password}, caching: {disabled: true}}')
          created=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" "$api")
          hyperdrive_id=$(jq -r 'if .success then .result.id else empty end' <<<"$created")
          if [ -z "$hyperdrive_id" ]; then
            echo "::error::Cloudflare did not create the Hyperdrive configuration"
            jq '{success, errors}' <<<"$created"
            exit 1
          fi
          echo "id=$hyperdrive_id" >> "$GITHUB_OUTPUT"

      - name: Upload full-stack Worker preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HYPERDRIVE_ID: ${{ steps.hyperdrive.outputs.id }}
        run: |
          set -euo pipefail
          preview_config="dist/branch_preview_example/wrangler.preview.json"
          jq \
            --arg id "$HYPERDRIVE_ID" \
            --arg deployment "pull-request-$PR_NUMBER" \
            --arg branch "$PSCALE_BRANCH" \
            --arg sha "$GITHUB_SHA" \
            '.hyperdrive = [{binding: "HYPERDRIVE", id: $id}] |
             .vars = {DEPLOYMENT_ENV: $deployment, PLANETSCALE_BRANCH: $branch, COMMIT_SHA: $sha} |
             .placement = {mode: "smart"}' \
            dist/branch_preview_example/wrangler.json > "$preview_config"

          npx wrangler versions upload --config "$preview_config" \
            --preview-alias "$PREVIEW_ALIAS" \
            --message "PR #$PR_NUMBER at $GITHUB_SHA"

          subdomain_response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")
          subdomain=$(jq -r '.result.subdomain' <<<"$subdomain_response")
          preview_url="https://$PREVIEW_ALIAS-$WORKER_NAME.$subdomain.workers.dev"
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Verify frontend, API, Hyperdrive, and PlanetScale
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "$PREVIEW_URL/" >/dev/null && \
              curl --fail --silent --show-error "$PREVIEW_URL/api/health" | jq -e --arg branch "$PSCALE_BRANCH" '.ok == true and .databaseBranch == $branch' >/dev/null && \
              curl --fail --silent --show-error "$PREVIEW_URL/api/notes" | jq -e '.notes | type == "array"' >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Preview did not become healthy"
          exit 1

      - name: Publish GitHub deployment
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: `pr-${process.env.PR_NUMBER}`,
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: "success",
              environment_url: process.env.PREVIEW_URL,
            });

      - name: Add preview link to pull request
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = "<!-- full-stack-branch-preview -->";
            const body = `${marker}\n## Full-stack branch preview\n\n✅ **[Open preview](${process.env.PREVIEW_URL})**\n\n- Worker alias: \`${process.env.PREVIEW_ALIAS}\`\n- PlanetScale branch: \`${process.env.PSCALE_BRANCH}\`\n- Database path: React → Hono → Cloudflare Hyperdrive → PlanetScale\n- Commit: \`${context.sha.slice(0, 7)}\``;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number, body });
            }

  cleanup:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: planetscale/setup-pscale-action@v1

      - name: Delete preview Hyperdrive
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs"
          list=$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api")
          hyperdrive_id=$(jq -r --arg name "$HYPERDRIVE_NAME" '.result[]? | select(.name == $name) | .id' <<<"$list" | head -n 1)
          if [ -n "$hyperdrive_id" ]; then
            curl --fail-with-body --silent --show-error -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$hyperdrive_id" >/dev/null
          fi

      - name: Delete preview PlanetScale branch
        env:
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          if pscale branch show "$PLANETSCALE_DATABASE_NAME" "$PSCALE_BRANCH" --org "$PLANETSCALE_ORG_NAME" >/dev/null 2>&1; then
            pscale branch delete "$PLANETSCALE_DATABASE_NAME" "$PSCALE_BRANCH" --force --org "$PLANETSCALE_ORG_NAME"
          fi
